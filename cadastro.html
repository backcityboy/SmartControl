<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=git pull origin main --allow-unrelated-histories, initial-scale=1.0">
    <title>SmartControl - Cadastro</title>
    <link rel="stylesheet" href="assets/css/style2.css">
</head>
<body>
    <header>
    </header>
    <main class="container">
            <div class="cards" id="card2">
                <div class="cadastro_info"></div>
                    <h3 id="text_cadastro">Faça seu cadastro</h3>
                    <form method="get" class="itens_cadastro"action="index.html">
                        <label class="etiquetas" for="nome_completo">Nome Completo:</label>
                        <input class="inputs" type="text" name="nome_completo" id="nome_completo" placeholder="Insira seu nome completo" required>

                        <label class="etiquetas" for="cpf">CPF:</label>
                        <input class="inputs" type="text" name="cpf" id="cpf" placeholder="Insira seu CPF" minlength="12" required>

                        <label class="etiquetas" for="email">Email Corporativo:</label>
                        <input class="inputs" type="email" name="email" id="email" placeholder="Insira seu email" required>

                        <label class="etiquetas" for="senha">Senha:</label>
                        <input class="inputs" type="password" name="senha" id="senha" placeholder="Crie uma senha" minlength="8" required>
                    <div class="nivel-check">
                        <label for="classificacao">Nível de Acesso:</label>
                        <select name="classificacao" id="classificacao">
                            <option value="" selected>Informe Nível de Acesso</option>
                            <option value="tecnico">Técnico</option>
                            <option value="cliente">Cliente</option>
                            <option value="admin">Administrador</option>
                        </select>

                        <label for="termos">Aceito os termos e condições</label>
                        <input type="checkbox" name="termos" id="termos">
                        
                    </div>
                        <div class="cadastro-return">
                            <button type="submit" id="cadastrar_button">Cadastrar-se</button>
                            <a href="index.html" id="return_button">Voltar ao Login</a>
                        </div>
                    </form>
                    
                </div>
                <div class="cards" id="card1">
                    
                    <img src="assets/images/logosmartcontrol.png" alt="logo" id="logo_site">
                </div>
            </div>
        
    </main>
    <script src="assets/js/main.js"></script>
</body>
</html>
